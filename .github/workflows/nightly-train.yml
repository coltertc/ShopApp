# Nightly sklearn training + batch scoring against Supabase.
# Runs node pipeline.js → pipeline_sklearn.py → models.joblib, then jobs/run_inference.py → order_predictions.
#
# Repo → Settings → Secrets → Actions: add DATABASE_URL (Supabase Postgres URI).
# Prefer the direct Postgres URI (port 5432) for CI batch jobs; pooler :6543 often works too.
# Artifacts are downloadable from each workflow run (Actions tab → run → Artifacts).

name: Nightly ML train

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline_sklearn
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_sklearn.py

      - name: Run batch inference (sklearn → order_predictions)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python jobs/run_inference.py

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ml-artifacts
          path: |
            models.joblib
            artifacts/feature_names.json
          if-no-files-found: warn
